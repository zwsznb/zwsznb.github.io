layout: default
--- -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Import style -->
    <link rel="stylesheet" href="//unpkg.com/element-plus/dist/index.css" />
    <!-- Import Vue 3 -->
    <script src="//unpkg.com/vue@3"></script>
    <!-- Import component library -->
    <script src="//unpkg.com/element-plus"></script>
</head>
<style>
    .main-box {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }
    /* 应用于所有你想隐藏滚动条但仍可滚动的元素（body 也可以） */
  .hide-scrollbar {
    overflow: auto;                 /* 保持可滚动 */
    -webkit-overflow-scrolling: touch; /* iOS 动量滚动 */
    -ms-overflow-style: none;       /* IE/Edge */
    scrollbar-width: none;          /* Firefox */
  }

  /* Chrome, Safari, Edge(Chromium) */
  .hide-scrollbar::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
    display: none; /* 有些浏览器支持，作为兜底 */
  }
</style>

<body>
<div id="app">
    <div class="common-layout">
        <el-container class="main-box">
            <el-aside style="width: 15%;overflow: hidden;">
                <h2 style="margin-top: 60%;margin-left: 30px;text-align: center;">分类</h2>
                <el-card class="hide-scrollbar" style="margin-left: 30px;overflow: auto;height: 60%;">
                    <div v-for="o in 30" :key="o" style="padding: 10px 0;text-align: center;">
                      {{'列表内容 ' + o }}
                    </div>
                  </el-card>

            </el-aside>
            <el-container>
                <el-header>
                </el-header>
                <el-main class="hide-scrollbar">
                    <el-row :gutter="20">
                        <el-col :span="7"></el-col>
                        <el-col :span="10">
                             <!-- 搜索框 -->
                    <div style="display: flex;">
                        <el-input placeholder="请输入内容" size="large" v-model="input3"/>
                      </div>
                       </el-col>
                        <el-col :span="7"><el-button size="large" type="primary">搜索</el-button></el-col>
                      </el-row>
                   
                      <!-- 资源列表 -->
                      <div class="hide-scrollbar" style="margin-top: 30px;height: 80%;overflow: auto;text-align: center;">
                        <el-card v-for="i in 40" shadow="always" style="display: inline-block;margin: 0 10px 20px 10px;">
                            <span style="margin-right: 10px;">寻秦记</span>
                            <el-button type="primary" size="small">复制链接</el-button>
                            <el-button type="success" size="small">直接跳转</el-button>
                          </el-card>
                      </div>
                      <br/>
<!-- 分页 -->

<el-row :gutter="20">
    <el-col :span="7"></el-col>
    <el-col :span="10">
         <!-- 搜索框 -->
         <el-pagination
         background
         layout="prev, pager, next"
         :total="1000">
       </el-pagination></el-col>
    <el-col :span="7"></el-col>
  </el-row>
                    
                </el-main>
            </el-container>
        </el-container>
    </div>
</div>
<script>
    const App = {
        data() {
            return {
                test: "测试"
            };
        },
    };
    const app = Vue.createApp(App);
    app.use(ElementPlus);
    app.mount("#app");
</script>



</body>

</html>
