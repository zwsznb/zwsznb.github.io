---
layout: default
---
<div id="app">
    <div class="common-layout">
        <el-container class="main-box">
            <el-aside width="200px"></el-aside>
            <el-container>
                <el-header></el-header>
                <el-main>
                    {% for s in site.data.source %}
                    <div>{{s.sourceName}}</div>
                    <div>{{s.url}}</div>
                    <br/> {% endfor %}
                </el-main>
                <div>count: {{site.data.source|size}}</div>
                <a href="/source?page=1"></a>
            </el-container>
        </el-container>
    </div>
</div>
<script>
    const App = {
        data() {
            return {
                test: "测试"
            };
        },
    };
    const app = Vue.createApp(App);
    app.use(ElementPlus);
    app.mount("#app");
</script>
