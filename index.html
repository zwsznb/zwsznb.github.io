---
layout: default
---
<div id="app">
    <div class="common-layout">
        <el-container class="main-box">
            <el-aside style="width: 15%;overflow: hidden;">
                <h2 style="margin-top: 60%;margin-left: 30px;text-align: center;">分类</h2>
                <el-card class="hide-scrollbar" style="margin-left: 30px;overflow: auto;height: 60%;">
                    <div v-for="(item,index) in types" :class="{type_active: currentType==item.index}" :key="index" @click="changeType(item.index)" style="padding: 10px 0;text-align: center;cursor: pointer;">
                       [[ item.name ]]
                    </div>
                  </el-card>

            </el-aside>
            <el-container>
                <el-header>
                </el-header>
                <el-main class="hide-scrollbar">
                    <el-row :gutter="20">
                        <el-col :span="7"></el-col>
                        <el-col :span="10">
                             <!-- 搜索框 -->
                    <div style="display: flex;">
                        <el-input placeholder="请输入内容" size="large" v-model="searchWord"/>
                      </div>
                       </el-col>
                        <el-col :span="7"><el-button size="large" type="primary" @click="searchSource">搜索</el-button></el-col>
                      </el-row>
                   
                      <!-- 资源列表 -->
                      <div class="hide-scrollbar" style="margin-top: 30px;height: 80%;overflow: auto;">
                        <el-card v-for="(item,index) in viewSource" :key="index" shadow="always" style="display: inline-block;margin: 0 10px 20px 10px;">
                            <span style="margin-right: 10px;">[[ item.sourceName ]]</span>
                            <el-button type="success" size="small" @click="jumpLink(item.url)">夸克网盘</el-button>
                          </el-card>
                      </div>
                      <br/>
                </el-main>
            </el-container>
        </el-container>
    </div>
</div>
<script>
    const App = {
        data() {
            return {
                source: {{site.data.source | jsonify}},
                types: {{site.data.types | jsonify}},
                viewSource: [],
                currentType: 1,
                searchWord: ''
            };
        },
        mounted: function () {
             this.changeType(this.currentType)
        },
        methods:{
            changeType(index){
                this.currentType = index;
                this.searchWord = '';
                if(this.currentType == 1)
                this.viewSource = this.source;
                else
                this.viewSource = this.source.filter(item => item.type == index);
            },
            jumpLink(url){
                window.location.href = url;
            },
            searchSource(){
                if(this.currentType == 1)
                this.viewSource = this.source.filter(item => item.sourceName.includes(this.searchWord));
                else
                this.viewSource = this.source.filter(item => item.sourceName.includes(this.searchWord)&&item.type == this.currentType);
            }
        }
    };
    const app = Vue.createApp(App);
    app.use(ElementPlus);
    app.config.compilerOptions.delimiters = ['[[', ']]']
    app.mount("#app");
</script>
